name: Publish Multi-Language Packages (GitHub Release, npm, PyPI, JitPack)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  github-release:
    name: Build All Artifacts & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Verify & Pack Node.js Library (npm tarball)
        run: |
          npm test
          npm pack

      - name: Build Python SDK (Wheel & sdist)
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Build Java SDK (Maven JAR)
        run: mvn -B -f sdks/java/pom.xml clean package

      - name: Create / Update GitHub Release with Multi-Language Binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ytdlm-*.tgz
            sdks/python/dist/*.whl
            sdks/python/dist/*.tar.gz
            sdks/java/target/*.jar

  publish-npm:
    name: Publish Node.js Package to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade npm to latest (for OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Run Verification Suite
        run: npm test

      - name: Publish to npm (OIDC Trusted Publisher or NPM_TOKEN)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish --provenance --access public

  publish-pypi:
    name: Build & Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python sdist and wheel
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI (OIDC Trusted Publisher or PYPI_API_TOKEN)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
