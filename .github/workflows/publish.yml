name: Publish Multi-Language Packages (GitHub Release, npm, PyPI, JitPack)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  github-release:
    name: Build All Artifacts & Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Verify & Pack Node.js Library (npm tarball)
        run: |
          npm test
          npm pack

      - name: Build Python SDK (Wheel & sdist)
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Build Java SDK (Maven JAR)
        run: mvn -B -f sdks/java/pom.xml clean package

      - name: Create / Update GitHub Release with Multi-Language Binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ytdlm-*.tgz
            sdks/python/dist/*.whl
            sdks/python/dist/*.tar.gz
            sdks/java/target/*.jar

  publish-npm:
    name: Publish Node.js Package to npm
    runs-on: ubuntu-latest
    environment: NPM_TOKEN
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Run Verification Suite
        run: npm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "@ytdlm/ytdlm@$PKG_VER" version >/dev/null 2>&1; then
            echo "@ytdlm/ytdlm@$PKG_VER is already published on npm; skipping."
            exit 0
          fi
          npm publish --provenance --access public || npm publish --access public

  publish-pypi:
    name: Build & Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python sdist and wheel
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI (OIDC Trusted Publisher or PYPI_API_TOKEN)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-rust:
    name: Publish Rust SDK to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish ytdlm-rs to crates.io
        working-directory: sdks/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not configured in GitHub Secrets; skipping CI crates.io publish."
            exit 0
          fi
          cargo publish --allow-dirty || true

