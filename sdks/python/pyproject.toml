[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdlm"
version = "1.1.0"
description = "Python SDK for ytdlm — Real-Time SABR UMP WebM/Opus Audio Streamer for Discord Bots"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  { name = "yt-dlm" }
]
keywords = ["audio", "streaming", "opus", "webm", "ump", "sabr", "discord", "music-bot"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/yt-dlm/ytdlm"
Repository = "https://github.com/yt-dlm/ytdlm.git"
Issues = "https://github.com/yt-dlm/ytdlm/issues"

[tool.setuptools]
py-modules = ["ytdlm", "discord_py_bot"]
