[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdlm"
version = "1.0.0"
description = "Python SDK for ytdlm — Real-Time SABR UMP WebM/Opus Audio Streamer for Discord Bots"
readme = "../../README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "ytdlm", email = "341343882+ytdlm@users.noreply.github.com" }
]
keywords = ["audio", "streaming", "opus", "webm", "ump", "sabr", "discord", "music-bot"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/ytdlm/ytdlm"
Repository = "https://github.com/ytdlm/ytdlm.git"
Issues = "https://github.com/ytdlm/ytdlm/issues"

[tool.setuptools]
py-modules = ["ytdlm"]
